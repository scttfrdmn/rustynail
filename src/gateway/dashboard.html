<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RustyNail Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
  header { background: #1a1d27; border-bottom: 1px solid #2d3148; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.4rem; font-weight: 700; color: #a78bfa; letter-spacing: -0.02em; }
  header h1 span { color: #60a5fa; }
  #last-updated { font-size: 0.75rem; color: #64748b; }
  main { padding: 2rem; max-width: 1400px; margin: 0 auto; }

  /* Stat cards */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .stat-card { background: #1a1d27; border: 1px solid #2d3148; border-radius: 0.75rem; padding: 1.25rem; }
  .stat-card .label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
  .stat-card .value { font-size: 2rem; font-weight: 700; color: #f8fafc; }
  .stat-card .sub { font-size: 0.75rem; color: #64748b; margin-top: 0.25rem; }

  /* Tables */
  .section { margin-bottom: 2rem; }
  .section h2 { font-size: 1rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.75rem; border-bottom: 1px solid #2d3148; padding-bottom: 0.5rem; }
  table { width: 100%; border-collapse: collapse; background: #1a1d27; border-radius: 0.75rem; overflow: hidden; font-size: 0.875rem; }
  th { text-align: left; padding: 0.75rem 1rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; background: #13151e; border-bottom: 1px solid #2d3148; }
  td { padding: 0.625rem 1rem; border-bottom: 1px solid #1e2130; color: #cbd5e1; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #1e2130; }

  /* Badges */
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .badge-healthy, .badge-ok { background: #14532d; color: #4ade80; }
  .badge-degraded { background: #713f12; color: #fbbf24; }
  .badge-unhealthy, .badge-error { background: #7f1d1d; color: #f87171; }
  .badge-inbound { background: #1e3a5f; color: #60a5fa; }
  .badge-outbound { background: #14532d; color: #4ade80; }
  .badge-running { background: #14532d; color: #4ade80; }
  .badge-stopped { background: #1e1b22; color: #6b7280; }

  /* quarry: gaps and unfunded get DIFFERENT colours on purpose. They are different
     denominations with opposite remedies — more time recovers a gap, more money funds
     an unfunded node — so one shared "incomplete" style would tell an operator to
     raise whichever cap came to mind. Amber for the clock, blue for the budget. */
  .badge-gap { background: #713f12; color: #fbbf24; }
  .badge-unfunded { background: #1e3a5f; color: #60a5fa; }
  .badge-cached { background: #164e63; color: #22d3ee; }
  .badge-verified { background: #14532d; color: #4ade80; }
  .badge-refuted { background: #7f1d1d; color: #f87171; }
  /* Not assessed is deliberately grey rather than red: nobody looked, which is not
     the same claim as "looked and found it wrong". */
  .badge-unassessed { background: #1e1b22; color: #94a3b8; }

  .empty-row td { color: #475569; font-style: italic; text-align: center; padding: 2rem; }

  /* quarry decomposition tree */
  #quarry-runs { display: flex; flex-direction: column; gap: 1rem; }
  .quarry-run { background: #1a1d27; border: 1px solid #2d3148; border-radius: 0.75rem; padding: 1rem 1.25rem; }
  .quarry-run .run-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.75rem; margin-bottom: 0.5rem; }
  .quarry-run .run-head .outcome { font-weight: 700; color: #f8fafc; }
  .quarry-run .run-head .spend { color: #cbd5e1; font-variant-numeric: tabular-nums; }
  .quarry-run .run-head .record-id { font-size: 0.7rem; color: #64748b; font-family: ui-monospace, monospace; }
  .quarry-run .run-notes { font-size: 0.8rem; color: #94a3b8; display: flex; flex-direction: column; gap: 0.2rem; margin-bottom: 0.75rem; }
  .quarry-tree { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; }
  .quarry-tree .node { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.15rem 0; }
  .quarry-tree .node .nid { color: #a78bfa; flex-shrink: 0; }
  .quarry-tree .node .ncost { color: #64748b; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .quarry-tree .node .nproblem { color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quarry-empty { color: #475569; font-style: italic; padding: 1.5rem; text-align: center; background: #1a1d27; border: 1px solid #2d3148; border-radius: 0.75rem; }
</style>
</head>
<body>
<header>
  <h1>Rusty<span>Nail</span> Dashboard</h1>
  <div id="last-updated">Loading…</div>
</header>
<main>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="label">Messages In</div>
      <div class="value" id="stat-in">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Messages Out</div>
      <div class="value" id="stat-out">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Active Users</div>
      <div class="value" id="stat-users">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Uptime</div>
      <div class="value" id="stat-uptime">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Msg Rate</div>
      <div class="value" id="stat-rate">—</div>
      <div class="sub">per minute</div>
    </div>
  </div>

  <div class="section">
    <h2>Channels</h2>
    <table>
      <thead><tr><th>Name</th><th>ID</th><th>Health</th><th>Status</th></tr></thead>
      <tbody id="channels-body"><tr class="empty-row"><td colspan="4">Loading…</td></tr></tbody>
    </table>
  </div>

  <div class="section">
    <h2>Recent Messages</h2>
    <table>
      <thead><tr><th>Time</th><th>Direction</th><th>Channel</th><th>User</th><th>Preview</th></tr></thead>
      <tbody id="messages-body"><tr class="empty-row"><td colspan="5">Loading…</td></tr></tbody>
    </table>
  </div>

  <div class="section">
    <h2>quarry Runs</h2>
    <div id="quarry-runs">
      <div class="quarry-empty">No quarry runs yet</div>
    </div>
  </div>
</main>

<script>
function fmtUptime(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return h > 0 ? `${h}h ${m}m ${sec}s` : m > 0 ? `${m}m ${sec}s` : `${sec}s`;
}

function fmtTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleTimeString();
  } catch { return iso; }
}

function healthBadge(h) {
  const cls = h.toLowerCase().includes('healthy') ? 'badge-healthy'
            : h.toLowerCase().includes('degraded') ? 'badge-degraded'
            : 'badge-error';
  return `<span class="badge ${cls}">${h}</span>`;
}

async function refresh() {
  try {
    const resp = await fetch('/dashboard/data');
    if (!resp.ok) { console.error('Dashboard data fetch failed', resp.status); return; }
    const d = await resp.json();

    document.getElementById('stat-in').textContent = d.messages_in.toLocaleString();
    document.getElementById('stat-out').textContent = d.messages_out.toLocaleString();
    document.getElementById('stat-users').textContent = d.active_users.toLocaleString();
    document.getElementById('stat-uptime').textContent = fmtUptime(d.uptime_seconds);

    const uptimeMin = Math.max(1, d.uptime_seconds / 60);
    const rate = (d.messages_in / uptimeMin).toFixed(2);
    document.getElementById('stat-rate').textContent = rate;

    // Channels table
    const cb = document.getElementById('channels-body');
    if (d.channels.length === 0) {
      cb.innerHTML = '<tr class="empty-row"><td colspan="4">No channels registered</td></tr>';
    } else {
      cb.innerHTML = d.channels.map(ch => `
        <tr>
          <td>${ch.name}</td>
          <td><code>${ch.id}</code></td>
          <td>${healthBadge(ch.health)}</td>
          <td><span class="badge ${ch.running ? 'badge-running' : 'badge-stopped'}">${ch.running ? 'Running' : 'Stopped'}</span></td>
        </tr>`).join('');
    }

    // Recent messages table
    const mb = document.getElementById('messages-body');
    if (d.recent_messages.length === 0) {
      mb.innerHTML = '<tr class="empty-row"><td colspan="5">No messages yet</td></tr>';
    } else {
      mb.innerHTML = d.recent_messages.map(m => `
        <tr>
          <td>${fmtTime(m.timestamp)}</td>
          <td><span class="badge badge-${m.direction}">${m.direction}</span></td>
          <td>${m.channel_id}</td>
          <td>${m.user_id}</td>
          <td>${m.content_preview}</td>
        </tr>`).join('');
    }

    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    console.error('Dashboard refresh error:', e);
    document.getElementById('last-updated').textContent = 'Error refreshing data';
  }
}

refresh();
setInterval(refresh, 30000);

// ── Live WebSocket updates ────────────────────────────────────────────────────
let ws = null;
let wsConnected = false;

function connectWs() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  try {
    ws = new WebSocket(`${protocol}//${location.host}/dashboard/ws`);
  } catch (e) {
    console.warn('WebSocket not supported or blocked, using polling only');
    return;
  }

  ws.onopen = function () {
    wsConnected = true;
    console.log('Dashboard WebSocket connected');
  };

  ws.onmessage = function (event) {
    try {
      const data = JSON.parse(event.data);
      if (data.type === 'stats_update') {
        document.getElementById('stat-in').textContent = data.messages_in.toLocaleString();
        document.getElementById('stat-out').textContent = data.messages_out.toLocaleString();
        document.getElementById('stat-users').textContent = data.active_users.toLocaleString();
        document.getElementById('stat-uptime').textContent = fmtUptime(data.uptime_seconds);
        const uptimeMin = Math.max(1, data.uptime_seconds / 60);
        const rate = (data.messages_in / uptimeMin).toFixed(2);
        document.getElementById('stat-rate').textContent = rate;
        document.getElementById('last-updated').textContent = 'Live ● ' + new Date().toLocaleTimeString();
      } else if (data.type === 'message_event') {
        prependMessageRow(data);
      } else if (data.type === 'quarry_run') {
        prependQuarryRun(data);
      }
      // An unrecognised `type` is ignored on purpose. quarry's own event union is open
      // — "adding an event kind cannot break an existing consumer" — and the same
      // courtesy applies here: a newer gateway must be able to send a kind this page
      // has never seen without breaking the rest of the dashboard.
    } catch (e) {
      console.error('WS parse error:', e);
    }
  };

  ws.onclose = function () {
    wsConnected = false;
    console.log('Dashboard WebSocket closed — reconnecting in 5s');
    setTimeout(connectWs, 5000);
  };

  ws.onerror = function () {
    // onerror is always followed by onclose; let onclose handle reconnect
    wsConnected = false;
  };
}

function prependMessageRow(data) {
  const mb = document.getElementById('messages-body');
  const emptyRow = mb.querySelector('.empty-row');
  if (emptyRow) emptyRow.remove();

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>${new Date().toLocaleTimeString()}</td>
    <td><span class="badge badge-${data.direction}">${data.direction}</span></td>
    <td>${data.channel}</td>
    <td>${data.user}</td>
    <td>${data.preview}</td>`;
  mb.insertBefore(tr, mb.firstChild);

  // Keep at most 50 rows
  while (mb.rows.length > 50) {
    mb.deleteRow(mb.rows.length - 1);
  }
}

// ── quarry decomposition tree ─────────────────────────────────────────────────

/// Escape text destined for innerHTML.
///
/// quarry node problems are sender-supplied text that has round-tripped through an
/// LLM, so it can contain anything. Interpolating it raw would put a script tag from a
/// chat message into the operator's dashboard.
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/// Micro-dollars as a currency figure. Four decimals, matching the chat receipt, so
/// the same run reads the same in both places.
function fmtMicros(m) {
  if (m == null) return 'not reported';
  if (m < 0) return 'no limit';
  return '$' + (m / 1000000).toFixed(4);
}

/// Render the tree from quarry's flat node list plus its `children` edges.
///
/// Depth comes from walking the edges the record states, not from counting the dots in
/// a node ID. The dots happen to encode depth today, but that is quarry's internal
/// naming rather than a documented contract, and the edges are stated explicitly.
function renderQuarryTree(nodes) {
  if (!nodes || nodes.length === 0) {
    return '<div class="quarry-tree"><div class="node"><span class="nproblem">No node detail — quarry wrote no record for this run.</span></div></div>';
  }

  const byId = new Map(nodes.map(n => [n.id, n]));
  const isChild = new Set();
  nodes.forEach(n => (n.children || []).forEach(c => isChild.add(c)));
  const roots = nodes.filter(n => !isChild.has(n.id));

  const rows = [];
  const seen = new Set();
  function walk(node, depth) {
    // A cycle would hang the page. quarry's trees are acyclic, but the guard costs
    // nothing and the alternative is an unresponsive dashboard.
    if (!node || seen.has(node.id)) return;
    seen.add(node.id);

    const badges = [];
    // Two badges, never one. See the CSS note: the remedies are opposite.
    if (node.gap) badges.push('<span class="badge badge-gap">time gap</span>');
    if (node.unfunded) badges.push('<span class="badge badge-unfunded">unfunded</span>');
    if (node.cache_hit) badges.push('<span class="badge badge-cached">cached</span>');
    // Three states, not two: null is "no verifier assessed", which is not a refutation.
    if (node.verified === true) badges.push('<span class="badge badge-verified">verified</span>');
    else if (node.verified === false) badges.push('<span class="badge badge-refuted">refuted</span>');
    else badges.push('<span class="badge badge-unassessed">not assessed</span>');

    rows.push(`<div class="node" style="padding-left:${depth * 1.25}rem">
      <span class="nid">${esc(node.id)}</span>
      <span class="ncost">${fmtMicros(node.cost_micro_usd)}</span>
      ${badges.join(' ')}
      <span class="nproblem">${esc(node.problem)}</span>
    </div>`);

    (node.children || []).forEach(cid => walk(byId.get(cid), depth + 1));
  }
  roots.forEach(r => walk(r, 0));
  // Any node not reachable from a root is still shown: dropping it would understate
  // the tree, and an orphan is itself worth seeing.
  nodes.forEach(n => { if (!seen.has(n.id)) walk(n, 0); });

  return `<div class="quarry-tree">${rows.join('')}</div>`;
}

function prependQuarryRun(data) {
  const container = document.getElementById('quarry-runs');
  const empty = container.querySelector('.quarry-empty');
  if (empty) empty.remove();

  const notes = [];

  // `bound_by` empty is a measurement quarry emits deliberately — no cap bound this
  // run — so it is stated rather than left off.
  notes.push(data.bound_by
    ? `Stopped by <strong>${esc(data.bound_by)}</strong>`
    : 'No limit was reached');

  // Two separate lines with two separate remedies. Never summed into one count.
  if (data.gaps > 0) {
    notes.push(`<span class="badge badge-gap">${data.gaps} time gap${data.gaps === 1 ? '' : 's'}</span> — more time would recover these; more money would not`);
  }
  if (data.unfunded > 0) {
    notes.push(`<span class="badge badge-unfunded">${data.unfunded} unfunded</span> — planned degradation; a higher spend limit would fund these`);
  }

  // "Not measured" is rendered in words. A missing rate is quarry declining to publish
  // one — every ordinary run is a single sample (P7) — and showing it as 0% would turn
  // that silence into a finding of total irreproducibility.
  notes.push(data.stability_measured
    ? `Stability: at least ${Math.round(data.stability * 100)}% of claims replicated`
    : 'Stability: not measured — one run is one sample, not a distribution (P7). This is not 0%.');

  const div = document.createElement('div');
  div.className = 'quarry-run';
  div.innerHTML = `
    <div class="run-head">
      <span class="outcome">${esc(data.outcome || 'unknown outcome')}</span>
      <span class="spend">${fmtMicros(data.spend_micro_usd)} of ${fmtMicros(data.cap_micro_usd)}</span>
      <span class="record-id">${esc(data.record_id || data.run_id)}</span>
    </div>
    <div class="run-notes">${notes.map(n => `<div>${n}</div>`).join('')}</div>
    ${renderQuarryTree(data.nodes)}`;
  container.insertBefore(div, container.firstChild);

  while (container.children.length > 10) {
    container.removeChild(container.lastChild);
  }
}

connectWs();
</script>
</body>
</html>
